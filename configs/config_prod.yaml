# 基础配置
app:
  port: 9000
  version: v0.1.0

# 数据库配置
database:
  driver: mysql
  source: root:123456@tcp(127.0.0.1:3306)/fibera?charset=utf8mb4&parseTime=True&loc=Local
  sync: false    # 自动同步数据库 (首次运行建议开启)
  max_idle_conns: 20    # 最大空闲连接数
  max_open_conns: 100    # 最大打开连接数

# redis配置
redis:
  enable: true    # 是否启用 redis
  addr: localhost:6379
  password:
  db: 0

# 日志配置
log:
  level: warn    # 日志级别 (debug、info、warn、error)
  format: json    # 日志格式 (text、json)
  output_method: file    # 日志输出方式 (console、file、default)
  output_dir: logs    # 日志输出目录
  max_size: 10    # 日志文件最大大小 (MB)
  max_backups: 15    # 日志文件最大备份数
  max_age: 30    # 日志文件最大保存天数

# jwt配置
jwt:
  issuer: fibera    # 签发者
  signing_method: HS256    # 签名算法 (HS256、HS384、HS512)
  expiration_time: 24h    # 过期时间 (单位 h)

# API文档配置
docs:
  enable: false    # 是否启用 API 文档，生产环境按需开启
  path: /docs    # 文档访问路径
  base_path: /    # 反向代理前缀，直连访问保持 / 即可
  title: Fibera API 文档    # 文档页面标题
  theme: none    # Scalar 主题 (none、default、alternate、moon、purple、solarized、bluePlanet、saturn、kepler、mars、deepSpace、laserwave)
  custom_style: ""    # 自定义样式，填写 Scalar 的 CSS 变量
  proxy_url: ""    # 代理地址，用于规避跨域请求限制
  cache_age: 60    # 文档页面缓存时间 (单位 s)
  fallback_cache_age: 86400    # 内置 Scalar 脚本缓存时间 (单位 s)
  force_offline: true    # 是否强制加载内置脚本，内网离线部署保持 true
