basePath: /
definitions:
  auth.LoginRequest:
    properties:
      password:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
      userInfo:
        $ref: '#/definitions/auth.LoginUserInfo'
    type: object
  auth.LoginUserInfo:
    properties:
      avatar:
        type: string
      createdAt:
        type: string
      deptId:
        type: integer
      email:
        type: string
      gender:
        type: string
      id:
        type: integer
      leader:
        type: string
      loginDate:
        type: string
      loginIp:
        type: string
      position:
        type: string
      status:
        type: boolean
      telephone:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
  common.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  user.CreateUserRequest:
    properties:
      avatar:
        type: string
      deptId:
        type: integer
      email:
        type: string
      gender:
        type: string
      leader:
        type: string
      operator:
        type: integer
      password:
        type: string
      position:
        type: string
      remark:
        type: string
      status:
        type: boolean
      telephone:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
  user.UpdateUserRequest:
    properties:
      avatar:
        type: string
      deptId:
        type: integer
      email:
        type: string
      gender:
        type: string
      leader:
        type: string
      operator:
        type: integer
      password:
        type: string
      position:
        type: string
      remark:
        type: string
      status:
        type: boolean
      telephone:
        type: string
      userName:
        type: string
    type: object
  user.UserResponse:
    properties:
      avatar:
        type: string
      createdAt:
        type: string
      deptId:
        type: integer
      email:
        type: string
      gender:
        type: string
      id:
        type: integer
      leader:
        type: string
      loginDate:
        type: string
      loginIp:
        type: string
      operator:
        type: integer
      position:
        type: string
      remark:
        type: string
      status:
        type: boolean
      telephone:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
info:
  contact: {}
  description: 基于 Go 与 Fiber v3 的后端服务骨架，提供登录认证与系统用户管理接口。
  title: Fibera API
  version: v0.1.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户ID与用户名二选一（同时提供时以用户ID为准），登录成功返回 token 与用户信息
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: 用户名（或用户ID）和密码不能为空
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/common.Response'
        "403":
          description: 用户已被禁用
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/common.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/users:
    get:
      description: 查询全部系统用户，返回结果不包含密码等敏感字段
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/user.UserResponse'
                  type: array
              type: object
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 系统用户
    post:
      consumes:
      - application/json
      description: 创建系统用户，密码在落库前进行加密处理
      parameters:
      - description: 创建用户请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.UserResponse'
              type: object
        "400":
          description: 请求参数有误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 系统用户
  /api/users/{id}:
    delete:
      description: 按主键删除系统用户
      parameters:
      - description: 用户主键
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 无效的用户ID
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 系统用户
    get:
      description: 按主键查询单个系统用户，返回结果不包含密码等敏感字段
      parameters:
      - description: 用户主键
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.UserResponse'
              type: object
        "400":
          description: 无效的用户ID
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取用户详情
      tags:
      - 系统用户
    put:
      consumes:
      - application/json
      description: 按主键更新系统用户信息
      parameters:
      - description: 用户主键
        in: path
        name: id
        required: true
        type: integer
      - description: 更新用户请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.UserResponse'
              type: object
        "400":
          description: 无效的用户ID或请求参数有误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未认证或 token 无效
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - 系统用户
securityDefinitions:
  BearerAuth:
    description: 除登录接口外，其余接口均需在请求头携带 Bearer <token>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
